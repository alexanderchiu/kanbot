# For the alembic command, such as drafting a migration:
#   KANBOT_DATABASE_URL=scratch.db uv run alembic revision --autogenerate -m "Add a column"
# Kanbot applies migrations itself at startup, or with: uv run kanbot migrate
[alembic]
script_location = %(here)s/src/kanbot/migrations
file_template = %%(rev)s_%%(slug)s
