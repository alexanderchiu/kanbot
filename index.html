<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kanban</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%23272822'/><rect x='3' y='3' width='2.6' height='10' fill='%23f92672'/><rect x='6.7' y='3' width='2.6' height='6' fill='%23e6db74'/><rect x='10.4' y='3' width='2.6' height='8' fill='%23a6e22e'/></svg>">
<style>
  :root {
    color-scheme: dark;
    --bg: #1e1f1c;
    --column: #272822;
    --card: #3e3d32;
    --field: #1e1f1c;
    --text: #f8f8f2;
    --muted: #b0ab92;
    --border: #5b5a4b;
    --pink: #f92672;
    --orange: #fd971f;
    --yellow: #e6db74;
    --green: #a6e22e;
    --blue: #66d9ef;
    --purple: #ae81ff;
    --on-color: #1e1f1c;
    --shadow: 0 1px 2px rgb(0 0 0 / 0.5);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 16px;
    padding: 12px 16px;
  }
  h1 { margin: 0 auto 0 0; font-size: 18px; font-weight: 650; color: var(--pink); }
  .filter { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  input[type="checkbox"] { width: 16px; height: 16px; margin: 0; accent-color: var(--purple); }
  select, input, textarea {
    background: var(--field);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
  }

  #banner {
    margin: 0 16px 8px;
    padding: 8px 12px;
    border-radius: 6px;
    background: var(--pink);
    color: var(--on-color);
  }

  main {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: minmax(0, 1fr);
    gap: 12px;
    padding: 0 16px 16px;
  }
  .column {
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: var(--column);
    border-radius: 10px;
  }
  .column-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 8px 8px 14px;
  }
  h2 { margin: 0; font-size: 14px; font-weight: 650; }
  [data-status="follow_up"] h2 { color: var(--blue); }
  [data-status="in_progress"] h2 { color: var(--orange); }
  [data-status="blocked"] h2 { color: var(--pink); }
  [data-status="done"] h2 { color: var(--green); }
  [data-status="cancelled"] h2 { color: var(--muted); }
  [data-status="cancelled"] .title { color: var(--muted); text-decoration: line-through; }
  .count { color: var(--muted); font-variant-numeric: tabular-nums; }
  .add {
    margin-left: auto;
    padding: 2px 10px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
  }
  .add:hover { background: var(--border); color: var(--text); }
  .cards {
    flex: 1;
    min-height: 64px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 2px 8px 10px;
  }
  .empty { margin: 8px 6px; color: var(--muted); }
  .card {
    flex: none;
    display: block;
    width: 100%;
    padding: 10px 12px;
    text-align: left;
    background: var(--card);
    border: 1px solid transparent;
    border-radius: 8px;
    box-shadow: var(--shadow);
    cursor: grab;
  }
  .card:hover { border-color: var(--border); }
  .card.dragging { opacity: 0.45; }
  .drop-line { flex: none; height: 3px; margin: -2px 0; border-radius: 2px; background: var(--blue); }
  .title { display: block; font-weight: 550; overflow-wrap: anywhere; }
  .snippet {
    display: -webkit-box;
    margin-top: 2px;
    overflow: hidden;
    color: var(--muted);
    font-size: 13px;
    overflow-wrap: anywhere;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    line-clamp: 2;
  }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; font-size: 12px; }
  .pill { padding: 1px 7px; border-radius: 999px; font-weight: 550; overflow-wrap: anywhere; }
  .high { background: var(--pink); color: var(--on-color); }
  .medium { background: var(--yellow); color: var(--on-color); }
  .low { background: var(--border); color: var(--text); }
  .idea { background: var(--purple); color: var(--on-color); }
  .project {
    padding: 0 6px;
    border: 1px solid var(--chip);
    border-radius: 4px;
    color: var(--chip);
  }
  .assignee { color: var(--text); overflow-wrap: anywhere; }
  .id { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }

  dialog {
    width: min(560px, calc(100vw - 32px));
    padding: 20px;
    background: var(--column);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  dialog::backdrop { background: rgb(0 0 0 / 0.6); }
  dialog h2 { margin-bottom: 14px; font-size: 16px; color: var(--text); }
  form { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  label { display: grid; gap: 4px; color: var(--muted); font-size: 13px; min-width: 0; }
  label input, label select, label textarea { width: 100%; color: var(--text); font-size: 14px; }
  .wide { grid-column: 1 / -1; }
  label.check { display: flex; align-items: center; gap: 8px; color: var(--text); font-size: 14px; }
  label.check input { width: 16px; }
  textarea { min-height: 140px; resize: vertical; }
  #error { color: var(--pink); }
  #stamps { color: var(--muted); font-size: 12px; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; }
  .actions button {
    padding: 7px 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--card);
    cursor: pointer;
  }
  .actions .primary { background: var(--green); border-color: var(--green); color: var(--on-color); font-weight: 600; }
  .actions .delete { margin-right: auto; color: var(--pink); }

  @media (max-width: 800px) {
    html, body { height: auto; }
    main { grid-auto-flow: row; }
    .cards { overflow-y: visible; }
    form { grid-template-columns: minmax(0, 1fr); }
  }
</style>
</head>
<body>
<header>
  <h1>Kanban</h1>
  <label class="filter"><input type="checkbox" id="show-cancelled"> Show cancelled <span id="cancelled-count"></span></label>
  <label class="filter"><input type="checkbox" id="ideas-only"> Ideas only</label>
  <label class="filter">Project
    <select id="filter"></select>
  </label>
</header>
<div id="banner" role="alert" hidden>Can't reach the kanban server. Retrying…</div>
<main id="board"></main>

<dialog id="dialog">
  <h2 id="dialog-title"></h2>
  <form id="form" method="dialog">
    <label class="wide">Title
      <input name="title" required maxlength="500" autocomplete="off">
    </label>
    <label class="wide">Description
      <textarea name="description"></textarea>
    </label>
    <label>Status
      <select name="status"></select>
    </label>
    <label>Priority
      <select name="priority"></select>
    </label>
    <label>Project
      <input name="project" list="project-list" autocomplete="off">
      <datalist id="project-list"></datalist>
    </label>
    <label>Assignee
      <input name="assignee" autocomplete="off">
    </label>
    <label class="check wide"><input type="checkbox" name="idea"> This ticket is an idea</label>
    <div id="error" class="wide" role="alert" hidden></div>
    <div id="stamps" class="wide" hidden></div>
    <div class="actions wide">
      <button type="button" class="delete" id="delete">Delete</button>
      <button type="button" id="cancel-ticket">Cancel ticket</button>
      <button type="button" id="close">Close</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</dialog>

<script>
const COLUMNS = [
  { status: "follow_up", label: "Follow-up" },
  { status: "in_progress", label: "In progress" },
  { status: "blocked", label: "Blocked" },
  { status: "done", label: "Done" },
];
const CANCELLED = { status: "cancelled", label: "Cancelled" };
const PRIORITIES = [
  { value: "high", label: "High" },
  { value: "medium", label: "Medium" },
  { value: "low", label: "Low" },
];
const PROJECT_COLORS = ["var(--green)", "var(--blue)", "var(--yellow)", "var(--orange)"];
const POLL_MS = 3000;

const $ = (id) => document.getElementById(id);
const board = $("board"), filter = $("filter"), ideasOnly = $("ideas-only"), showCancelled = $("show-cancelled"), dialog = $("dialog"), form = $("form");

let tickets = [];
let lastPayload = null;
let draggingId = null;
let editing = null; // The ticket open in the dialog; null when creating one.
const dropLine = Object.assign(document.createElement("div"), { className: "drop-line" });

// All ticket text comes from agents, so it is only ever inserted as text nodes.
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function projectColor(name) {
  let hash = 0;
  for (const ch of name) hash = (hash * 31 + ch.codePointAt(0)) % PROJECT_COLORS.length;
  return PROJECT_COLORS[hash];
}

async function api(method, path, body) {
  const response = await fetch(path, {
    method,
    headers: body ? { "Content-Type": "application/json" } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || `Request failed (${response.status})`);
  return data;
}

function loadSetting(key) {
  try { return localStorage.getItem(key) || ""; } catch { return ""; }
}

function saveSetting(key, value) {
  try { localStorage.setItem(key, value); } catch {}
}

function renderFilter() {
  const projects = [...new Set(tickets.map((t) => t.project).filter(Boolean))].sort();
  const current = filter.value || loadSetting("kanban-project");
  const options = current && !projects.includes(current) ? [...projects, current].sort() : projects;

  filter.replaceChildren(new Option("All projects", ""), ...options.map((p) => new Option(p, p)));
  filter.value = current;
  $("project-list").replaceChildren(...projects.map((p) => new Option(p, p)));
}

function shortDate(iso) {
  return new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

function renderCard(ticket) {
  const card = el("button", "card");
  card.type = "button";
  card.draggable = true;
  card.dataset.id = ticket.id;
  card.append(el("span", "title", ticket.title));
  if (ticket.description) card.append(el("span", "snippet", ticket.description));

  const meta = el("span", "meta");
  meta.append(el("span", `pill ${ticket.priority}`, PRIORITIES.find((p) => p.value === ticket.priority).label));
  if (ticket.idea) meta.append(el("span", "pill idea", "Idea"));
  if (ticket.project) {
    const chip = el("span", "pill project", ticket.project);
    chip.style.setProperty("--chip", projectColor(ticket.project));
    meta.append(chip);
  }
  const date = ticket.completed_at
    ? `Completed ${shortDate(ticket.completed_at)}`
    : `Created ${shortDate(ticket.created_at)}`;
  if (ticket.assignee) meta.append(el("span", "assignee", `@${ticket.assignee}`));
  meta.append(el("span", "id", `${date} · #${ticket.id}`));
  card.append(meta);

  card.addEventListener("click", () => openDialog(ticket));
  card.addEventListener("dragstart", (event) => {
    draggingId = ticket.id;
    event.dataTransfer.effectAllowed = "move";
    event.dataTransfer.setData("text/plain", String(ticket.id));
    requestAnimationFrame(() => card.classList.add("dragging"));
  });
  card.addEventListener("dragend", () => {
    draggingId = null;
    dropLine.remove();
    refresh(true);
  });
  return card;
}

function renderColumn({ status, label }, visible) {
  const column = el("section", "column");
  column.dataset.status = status;
  const head = el("div", "column-head");
  head.append(el("h2", "", label), el("span", "count", visible.length));
  if (status !== CANCELLED.status) {
    const add = el("button", "add", "+ Add");
    add.type = "button";
    add.setAttribute("aria-label", `Add ticket to ${label}`);
    add.addEventListener("click", () => openDialog(null, status));
    head.append(add);
  }

  const cards = el("div", "cards");
  if (visible.length) cards.append(...visible.map(renderCard));
  else cards.append(el("p", "empty", "No tickets"));

  cards.addEventListener("dragover", (event) => {
    if (draggingId === null) return;
    event.preventDefault();
    cards.insertBefore(dropLine, cardAfterPointer(cards, event.clientY));
  });
  cards.addEventListener("drop", (event) => {
    if (draggingId === null) return;
    event.preventDefault();
    drop(status, cards, draggingId);
  });

  column.append(head, cards);
  return column;
}

function render() {
  renderFilter();
  const visible = tickets.filter(
    (t) => (!filter.value || t.project === filter.value) && (!ideasOnly.checked || t.idea)
  );
  const cancelled = visible.filter((t) => t.status === CANCELLED.status);
  $("cancelled-count").textContent = `(${cancelled.length})`;
  const columns = showCancelled.checked ? [...COLUMNS, CANCELLED] : COLUMNS;
  board.replaceChildren(
    ...columns.map((column) =>
      renderColumn(column, visible.filter((t) => t.status === column.status))
    )
  );
}

function cardAfterPointer(cards, y) {
  for (const card of cards.querySelectorAll(".card:not(.dragging)")) {
    const box = card.getBoundingClientRect();
    if (y < box.top + box.height / 2) return card;
  }
  return null;
}

// Positions index the whole column, which can hold tickets hidden by the filters.
async function drop(status, cards, id) {
  const column = tickets.filter((t) => t.status === status && t.id !== id);
  const indexOf = (card) => column.findIndex((t) => t.id === Number(card.dataset.id));
  const next = dropLine.nextElementSibling;
  let position = column.length;
  if (next?.classList.contains("card") && !next.classList.contains("dragging")) {
    position = indexOf(next);
  } else {
    const before = [...cards.querySelectorAll(".card:not(.dragging)")].at(-1);
    if (before) position = indexOf(before) + 1;
  }
  dropLine.remove();
  try {
    await api("PATCH", `/api/tickets/${id}`, { status, position });
  } catch (error) {
    alert(error.message);
  }
  await refresh(true);
}

function openDialog(ticket, status = "follow_up") {
  editing = ticket;
  $("dialog-title").textContent = ticket ? `Edit ticket #${ticket.id}` : "New ticket";
  form.elements.title.value = ticket?.title ?? "";
  form.elements.description.value = ticket?.description ?? "";
  form.elements.status.value = ticket?.status ?? status;
  form.elements.priority.value = ticket?.priority ?? "medium";
  form.elements.project.value = ticket ? ticket.project ?? "" : filter.value;
  form.elements.assignee.value = ticket?.assignee ?? "";
  form.elements.idea.checked = ticket ? ticket.idea : ideasOnly.checked;
  $("delete").hidden = !ticket;
  $("cancel-ticket").hidden = !ticket || ticket.status === CANCELLED.status;
  $("error").hidden = true;
  $("stamps").hidden = !ticket;
  if (ticket) {
    const when = (iso) => new Date(iso).toLocaleString();
    const completed = ticket.completed_at ? ` · Completed ${when(ticket.completed_at)}` : "";
    const creator = ticket.created_by ? ` by ${ticket.created_by}` : "";
    $("stamps").textContent = `Created ${when(ticket.created_at)}${creator}${completed} · Updated ${when(ticket.updated_at)}`;
  }
  dialog.showModal();
  form.elements.title.focus();
}

function showError(message) {
  $("error").textContent = message;
  $("error").hidden = false;
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const values = {
    title: form.elements.title.value,
    description: form.elements.description.value,
    status: form.elements.status.value,
    priority: form.elements.priority.value,
    project: form.elements.project.value.trim().toLowerCase() || null,
    idea: form.elements.idea.checked,
    assignee: form.elements.assignee.value.trim().toLowerCase() || null,
  };
  try {
    if (editing) {
      // Send only what changed, so saving can't undo an agent's concurrent edit.
      const changes = Object.fromEntries(
        Object.entries(values).filter(([key, value]) => value !== editing[key])
      );
      if (Object.keys(changes).length) await api("PATCH", `/api/tickets/${editing.id}`, changes);
    } else {
      await api("POST", "/api/tickets", { ...values, created_by: "user" });
    }
    dialog.close();
    await refresh(true);
  } catch (error) {
    showError(error.message);
  }
});

$("close").addEventListener("click", () => dialog.close());

// Submitting the form keeps any edits made in the dialog before cancelling.
$("cancel-ticket").addEventListener("click", () => {
  form.elements.status.value = CANCELLED.status;
  form.requestSubmit();
});

$("delete").addEventListener("click", async () => {
  if (!confirm(`Delete ticket #${editing.id}? This can't be undone.`)) return;
  try {
    await api("DELETE", `/api/tickets/${editing.id}`);
    dialog.close();
    await refresh(true);
  } catch (error) {
    showError(error.message);
  }
});

filter.addEventListener("change", () => {
  saveSetting("kanban-project", filter.value);
  render();
});

ideasOnly.addEventListener("change", () => {
  saveSetting("kanban-ideas-only", ideasOnly.checked ? "1" : "");
  render();
});

showCancelled.addEventListener("change", () => {
  saveSetting("kanban-show-cancelled", showCancelled.checked ? "1" : "");
  render();
});

async function refresh(force = false) {
  try {
    const response = await fetch("/api/tickets");
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const payload = await response.text();
    $("banner").hidden = true;
    // Don't rebuild the board under a drag or when nothing has changed.
    if (draggingId !== null || (!force && payload === lastPayload)) return;
    lastPayload = payload;
    tickets = JSON.parse(payload);
    render();
  } catch {
    $("banner").hidden = false;
  }
}

form.elements.status.append(...[...COLUMNS, CANCELLED].map((c) => new Option(c.label, c.status)));
form.elements.priority.append(...PRIORITIES.map((p) => new Option(p.label, p.value)));
ideasOnly.checked = loadSetting("kanban-ideas-only") === "1";
showCancelled.checked = loadSetting("kanban-show-cancelled") === "1";
refresh(true);
setInterval(refresh, POLL_MS);
</script>
</body>
</html>
