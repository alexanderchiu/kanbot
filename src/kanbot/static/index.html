<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#191a17">
<title>Kanbot</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/base.css">
<link rel="stylesheet" href="/static/css/header.css">
<link rel="stylesheet" href="/static/css/board.css">
<link rel="stylesheet" href="/static/css/panel.css">
<link rel="stylesheet" href="/static/css/responsive.css">
<link rel="stylesheet" href="/static/css/stats.css">
<link rel="stylesheet" href="/static/css/agents.css">
</head>
<body>
<header>
  <h1><svg class="logo" width="22" height="22" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#a6e22e"/><rect x="7" y="8" width="4.5" height="16" rx="2.25" fill="#191a17"/><rect x="13.75" y="8" width="4.5" height="10" rx="2.25" fill="#191a17"/><rect x="20.5" y="8" width="4.5" height="13" rx="2.25" fill="#191a17"/></svg>Kanbot</h1>
  <nav class="view-switch" aria-label="View">
    <a href="#board" id="view-board" aria-current="page">Board</a>
    <a href="#stats" id="view-stats">Stats</a>
    <a href="#agents" id="view-agents">Agents<span class="badge" id="agents-badge" aria-hidden="true" hidden></span></a>
  </nav>
  <label class="search">
    <span class="sr-only">Search tickets</span>
    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
    <input type="search" id="search" class="control" placeholder="Search" autocomplete="off">
    <kbd class="hint" aria-hidden="true">/</kbd>
  </label>
  <label class="sr-only" for="filter">Project</label>
  <select id="filter" class="control"></select>
  <label class="toggle"><input type="checkbox" id="ideas-only"> Ideas</label>
  <label class="toggle"><input type="checkbox" id="show-cancelled"> Cancelled <span class="count" id="cancelled-count"></span></label>
  <button type="button" class="button primary" id="new-ticket">New ticket <kbd class="hint" aria-hidden="true">N</kbd></button>
</header>
<div id="filtered-empty" role="status" hidden>
  No tickets match the current filters.
  <button type="button" class="button quiet" id="clear-filters">Clear filters</button>
</div>
<div id="banner" role="alert" hidden>Can't reach the Kanbot server. Retrying…</div>
<main id="board"></main>
<main id="stats-view" hidden aria-label="Statistics"></main>
<main id="agents-view" hidden aria-label="Agents"></main>
<div id="toast" role="status" hidden></div>

<dialog id="dialog">
  <div class="panel-head">
    <h2 id="dialog-title"></h2>
    <button type="button" class="icon-button" id="close" aria-label="Close">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"/></svg>
    </button>
  </div>
  <div class="panel-body">
    <form id="form">
      <label class="sr-only" for="ticket-title">Title</label>
      <textarea id="ticket-title" name="title" class="bare" rows="1" required maxlength="500" placeholder="Ticket title" autocomplete="off"></textarea>
      <label class="sr-only" for="ticket-description">Description</label>
      <textarea id="ticket-description" name="description" class="bare" rows="3" placeholder="Add a description"></textarea>
      <div id="description-links"></div>
      <div class="properties">
        <label class="property">Status <select name="status"></select></label>
        <label class="property">Priority <select name="priority"></select></label>
        <label class="property">Project
          <input name="project" list="project-list" placeholder="None" autocomplete="off">
        </label>
        <datalist id="project-list"></datalist>
        <label class="property">Assignee <input name="assignee" placeholder="Unassigned" autocomplete="off"></label>
        <label class="property">Idea <input type="checkbox" class="switch" name="idea"></label>
      </div>
      <div class="dependencies">
        <h3>Depends on</h3>
        <div id="depends-on" class="links-list"></div>
        <label class="sr-only" for="add-dependency">Add a dependency</label>
        <input id="add-dependency" class="bare" list="ticket-list" placeholder="Add a dependency by number or title" autocomplete="off">
        <datalist id="ticket-list"></datalist>
        <div id="blocks-section" hidden>
          <h3>Blocks</h3>
          <div id="blocks" class="links-list"></div>
        </div>
      </div>
      <div id="stamps" hidden></div>
    </form>
    <section id="activity" hidden>
      <h3>Notes</h3>
      <div id="notes"></div>
      <div class="composer">
        <label class="sr-only" for="note-input">Add a note</label>
        <textarea id="note-input" placeholder="Add a note"></textarea>
        <div class="composer-actions">
          <span class="hint"><kbd>Ctrl</kbd> <kbd>Enter</kbd></span>
          <button type="button" class="button" id="add-note">Add note</button>
        </div>
      </div>
      <details>
        <summary>History</summary>
        <ul id="history"></ul>
      </details>
    </section>
  </div>
  <div class="panel-foot">
    <div id="error" role="alert" hidden></div>
    <button type="button" class="button danger" id="delete">Delete</button>
    <button type="button" class="button quiet" id="cancel-ticket">Cancel ticket</button>
    <button type="submit" form="form" class="button primary">Save</button>
  </div>
</dialog>

<script type="module" src="/static/js/main.js"></script>
</body>
</html>
