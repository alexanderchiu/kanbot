<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#191a17">
<title>Kanbot</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/base.css">
<link rel="stylesheet" href="/static/css/header.css">
<link rel="stylesheet" href="/static/css/board.css">
<link rel="stylesheet" href="/static/css/panel.css">
<link rel="stylesheet" href="/static/css/responsive.css">
<link rel="stylesheet" href="/static/css/stats.css">
</head>
<body>
<header>
  <h1><svg class="logo" width="22" height="22" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#a6e22e"/><rect x="7" y="8" width="4.5" height="16" rx="2.25" fill="#191a17"/><rect x="13.75" y="8" width="4.5" height="10" rx="2.25" fill="#191a17"/><rect x="20.5" y="8" width="4.5" height="13" rx="2.25" fill="#191a17"/></svg>Kanbot</h1>
  <nav class="view-switch" aria-label="View">
    <a href="#board" id="view-board" aria-current="page">Board</a>
    <a href="#stats" id="view-stats">Stats</a>
  </nav>
  <label class="search">
    <span class="sr-only">Search tickets</span>
    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
    <input type="search" id="search" class="control" placeholder="Search" autocomplete="off">
    <kbd class="hint" aria-hidden="true">/</kbd>
  </label>
  <label class="sr-only" for="filter">Project</label>
  <select id="filter" class="control"></select>
  <label class="toggle"><input type="checkbox" id="ideas-only"> Ideas</label>
  <label class="toggle"><input type="checkbox" id="show-cancelled"> Cancelled <span class="count" id="cancelled-count"></span></label>
  <button type="button" class="button primary" id="new-ticket">New ticket <kbd class="hint" aria-hidden="true">N</kbd></button>
</header>
<div id="filtered-empty" role="status" hidden>
  No tickets match the current filters.
  <button type="button" class="button quiet" id="clear-filters">Clear filters</button>
</div>
<div id="banner" role="alert" hidden>Can't reach the Kanbot server. Retrying…</div>
<main id="board"></main>
<main id="stats-view" hidden aria-label="Statistics"></main>
<div id="toast" role="status" hidden></div>

<dialog id="dialog">
  <div class="panel-head">
    <h2 id="dialog-title"></h2>
    <button type="button" class="icon-button" id="close" aria-label="Close">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"/></svg>
    </button>
  </div>
  <div class="panel-body">
    <form id="form">
      <label class="sr-only" for="ticket-title">Title</label>
      <textarea id="ticket-title" name="title" class="bare" rows="1" required maxlength="500" placeholder="Ticket title" autocomplete="off"></textarea>
      <label class="sr-only" for="ticket-description">Description</label>
      <textarea id="ticket-description" name="description" class="bare" rows="3" placeholder="Add a description"></textarea>
      <div id="description-links"></div>
      <div class="properties">
        <label class="property">Status <select name="status"></select></label>
        <label class="property">Priority <select name="priority"></select></label>
        <label class="property">Project
          <input name="project" list="project-list" placeholder="None" autocomplete="off">
        </label>
        <datalist id="project-list"></datalist>
        <label class="property">Assignee <input name="assignee" placeholder="Unassigned" autocomplete="off"></label>
        <label class="property">Idea <input type="checkbox" class="switch" name="idea"></label>
      </div>
      <div class="dependencies">
        <h3>Depends on</h3>
        <div id="depends-on" class="links-list"></div>
        <label class="sr-only" for="add-dependency">Add a dependency</label>
        <input id="add-dependency" class="bare" list="ticket-list" placeholder="Add a dependency by number or title" autocomplete="off">
        <datalist id="ticket-list"></datalist>
        <div id="blocks-section" hidden>
          <h3>Blocks</h3>
          <div id="blocks" class="links-list"></div>
        </div>
      </div>
      <div id="stamps" hidden></div>
    </form>
    <section id="activity" hidden>
      <h3>Notes</h3>
      <div id="notes"></div>
      <div class="composer">
        <label class="sr-only" for="note-input">Add a note</label>
        <textarea id="note-input" placeholder="Add a note"></textarea>
        <div class="composer-actions">
          <span class="hint"><kbd>Ctrl</kbd> <kbd>Enter</kbd></span>
          <button type="button" class="button" id="add-note">Add note</button>
        </div>
      </div>
      <details>
        <summary>History</summary>
        <ul id="history"></ul>
      </details>
    </section>
  </div>
  <div class="panel-foot">
    <div id="error" role="alert" hidden></div>
    <button type="button" class="button danger" id="delete">Delete</button>
    <button type="button" class="button quiet" id="cancel-ticket">Cancel ticket</button>
    <button type="submit" form="form" class="button primary">Save</button>
  </div>
</dialog>

<script>
const COLUMNS = [
  { status: "follow_up", label: "Follow-up" },
  { status: "in_progress", label: "In progress" },
  { status: "blocked", label: "Blocked" },
  { status: "done", label: "Done" },
];
const CANCELLED = { status: "cancelled", label: "Cancelled" };
const PRIORITIES = [
  { value: "high", label: "High" },
  { value: "medium", label: "Medium" },
  { value: "low", label: "Low" },
];
const POLL_MS = 3000;
const TOAST_MS = 4000;
const CONFIRM_MS = 4000;

// Static markup only. Ticket text never goes through innerHTML.
const ICONS = {
  plus: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9"/></svg>',
  bars: '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><rect x="1" y="7" width="2.4" height="4" rx="0.6"/><rect x="4.8" y="4" width="2.4" height="7" rx="0.6"/><rect x="8.6" y="1" width="2.4" height="10" rx="0.6"/></svg>',
  note: '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 3.5h11v8h-6l-3 2.5v-2.5h-2z"/></svg>',
};

const $ = (id) => document.getElementById(id);
const board = $("board"), filter = $("filter"), ideasOnly = $("ideas-only"), showCancelled = $("show-cancelled"), dialog = $("dialog"), form = $("form");
const ALL_COLUMNS = [...COLUMNS, CANCELLED];

let tickets = [];
let lastPayload = null;
let draggingId = null;
let editing = null; // The ticket open in the panel; null when creating one.
let initialValues = null;
let warnedUnsaved = false;
let pendingDependencies = [];
let addedDependencies = new Set(); // What the user changed, applied to the fresh list on save.
let removedDependencies = new Set();
let editingGone = false;
let opener = null; // Where focus returns when the panel closes.
let toastTimer, confirmTimer;
const dropLine = Object.assign(document.createElement("div"), { className: "drop-line" });

// All ticket text comes from agents, so it is only ever inserted as text nodes.
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function icon(name, className) {
  const node = el("span", className);
  node.innerHTML = ICONS[name];
  return node;
}

// Only http and https match, so ticket text can't create a javascript: link.
const URL_PATTERN = /https?:\/\/[^\s<>"']+/g;

function trimUrl(url) {
  const count = (char) => url.split(char).length - 1;
  for (;;) {
    const trimmed = url.replace(/[.,;:!?\]}]+$/, "");
    if (trimmed !== url) url = trimmed;
    else if (url.endsWith(")") && count(")") > count("(")) url = url.slice(0, -1);
    else return url;
  }
}

function urlsIn(text) {
  return [...text.matchAll(URL_PATTERN)].map((match) => trimUrl(match[0]));
}

function linkNode(url) {
  const link = el("a", "", url);
  link.href = url;
  link.target = "_blank";
  link.rel = "noopener noreferrer";
  link.draggable = false;
  return link;
}

function appendLinked(parent, text) {
  let rest = text;
  for (const url of urlsIn(text)) {
    const start = rest.indexOf(url);
    parent.append(rest.slice(0, start), linkNode(url));
    rest = rest.slice(start + url.length);
  }
  parent.append(rest);
}

function renderDescriptionLinks() {
  const urls = [...new Set(urlsIn(form.elements.description.value))];
  $("description-links").replaceChildren(...urls.map(linkNode));
}

async function api(method, path, body) {
  const response = await fetch(path, {
    method,
    headers: body ? { "Content-Type": "application/json" } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || `Request failed (${response.status})`);
  return data;
}

function loadSetting(key) {
  try { return localStorage.getItem(key) || ""; } catch { return ""; }
}

function saveSetting(key, value) {
  try { localStorage.setItem(key, value); } catch {}
}

function showToast(message) {
  const toast = $("toast");
  toast.textContent = message;
  toast.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.hidden = true; }, TOAST_MS);
}

function renderFilter() {
  const projects = [...new Set(tickets.map((t) => t.project).filter(Boolean))].sort();
  // A saved project that no longer has tickets, for example after a rename, would hide
  // the whole board, so fall back to all projects.
  const saved = filter.value || loadSetting("kanban-project");
  const current = projects.includes(saved) ? saved : "";
  if (saved !== current) saveSetting("kanban-project", "");

  filter.replaceChildren(new Option("All projects", ""), ...projects.map((p) => new Option(p, p)));
  filter.value = current;
  $("project-list").replaceChildren(...projects.map((p) => new Option(p, p)));
  $("ticket-list").replaceChildren(...tickets.map((t) => new Option(`#${t.id} ${t.title}`)));
}

const shortDate = (iso) => new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric" });
const timestamp = (iso) => new Date(iso).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });

function renderCard(ticket) {
  // A div, not a button, because buttons can't contain working links.
  const card = el("div", "card");
  card.draggable = true;
  card.dataset.id = ticket.id;
  const title = el("button", "title", ticket.title);
  title.type = "button";
  card.append(title);
  if (ticket.description) {
    const snippet = el("div", "snippet");
    appendLinked(snippet, ticket.description);
    card.append(snippet);
  }

  const meta = el("div", "meta");
  const priority = PRIORITIES.find((p) => p.value === ticket.priority).label;
  const bars = icon("bars", `priority ${ticket.priority}`);
  bars.title = `${priority} priority`;
  bars.append(el("span", "sr-only", `${priority} priority`));
  meta.append(bars);
  if (ticket.idea) meta.append(el("span", "idea", "Idea"));
  if (ticket.blocked_by.length) {
    const waiting = el("span", "waiting", `Waiting on ${ticket.blocked_by.map((id) => `#${id}`).join(", ")}`);
    waiting.title = ticket.blocked_by.map((id) => `#${id} ${ticketById(id)?.title ?? ""}`).join("\n");
    meta.append(waiting);
  }
  if (ticket.project) meta.append(el("span", "project", ticket.project));
  if (ticket.assignee) {
    const assignee = el("span", "assignee");
    assignee.title = `Assigned to ${ticket.assignee}`;
    assignee.append(el("span", "avatar", ticket.assignee[0]), ticket.assignee);
    meta.append(assignee);
  }
  if (ticket.note_count) {
    const noun = ticket.note_count === 1 ? "note" : "notes";
    const notes = icon("note", "note-count");
    notes.title = `${ticket.note_count} ${noun}`;
    notes.append(String(ticket.note_count));
    meta.append(notes);
  }
  if (ticket.created_by) {
    const creator = el("span", "creator", `by ${ticket.created_by}`);
    creator.title = `Created by ${ticket.created_by}`;
    meta.append(creator);
  }
  const date = ticket.completed_at
    ? ["Completed", ticket.completed_at]
    : ["Created", ticket.created_at];
  const id = el("span", "id", `#${ticket.id} · ${shortDate(date[1])}`);
  id.title = `${date[0]} ${timestamp(date[1])}`;
  meta.append(id);
  card.append(meta);

  card.addEventListener("click", (event) => {
    if (!event.target.closest("a")) openPanel(ticket);
  });
  card.addEventListener("dragstart", (event) => {
    draggingId = ticket.id;
    event.dataTransfer.effectAllowed = "move";
    event.dataTransfer.setData("text/plain", String(ticket.id));
    requestAnimationFrame(() => card.classList.add("dragging"));
  });
  card.addEventListener("dragend", () => {
    if (draggingId === null) return;
    draggingId = null;
    dropLine.remove();
    refresh(true);
  });
  return card;
}

function renderColumn({ status, label }, visible) {
  const column = el("section", "column");
  column.dataset.status = status;
  column.setAttribute("aria-label", label);
  const head = el("div", "column-head");
  head.append(el("h2", "", label), el("span", "count", visible.length));
  if (status !== CANCELLED.status) {
    const add = el("button", "icon-button add");
    add.type = "button";
    add.innerHTML = ICONS.plus;
    add.setAttribute("aria-label", `Add ticket to ${label}`);
    add.title = "Add ticket";
    add.addEventListener("click", () => openPanel(null, status));
    head.append(add);
  }

  const cards = el("div", "cards");
  if (visible.length) cards.append(...visible.map(renderCard));
  else cards.append(el("p", "empty", "No tickets"));

  cards.addEventListener("dragover", (event) => {
    if (draggingId === null) return;
    event.preventDefault();
    cards.insertBefore(dropLine, cardAfterPointer(cards, event.clientY));
  });
  cards.addEventListener("drop", (event) => {
    if (draggingId === null) return;
    event.preventDefault();
    drop(status, cards, draggingId);
  });

  column.append(head, cards);
  return column;
}

function ticketById(id) {
  return tickets.find((t) => t.id === id);
}

function searchText(ticket) {
  const { id, title, description, project, assignee, created_by } = ticket;
  return [`#${id}`, title, description, project, assignee, created_by].join(" ").toLowerCase();
}

function render() {
  renderFilter();
  const query = $("search").value.trim().toLowerCase();
  const visible = tickets.filter(
    (t) =>
      (!filter.value || t.project === filter.value) &&
      (!ideasOnly.checked || t.idea) &&
      (!query || searchText(t).includes(query))
  );
  const cancelled = visible.filter((t) => t.status === CANCELLED.status);
  $("cancelled-count").textContent = cancelled.length;
  const shown = showCancelled.checked ? visible : visible.filter((t) => t.status !== CANCELLED.status);
  const filtering = Boolean(filter.value || ideasOnly.checked || query);
  $("filtered-empty").hidden = !(filtering && tickets.length && !shown.length);

  // Rebuilding the board mustn't lose the reader's place when an agent changes a ticket.
  const scroll = {};
  for (const column of board.children) scroll[column.dataset.status] = column.querySelector(".cards").scrollTop;
  const boardScroll = board.scrollLeft;
  const focused = focusTarget(document.activeElement);

  const columns = showCancelled.checked ? ALL_COLUMNS : COLUMNS;
  board.replaceChildren(
    ...columns.map((column) =>
      renderColumn(column, visible.filter((t) => t.status === column.status))
    )
  );

  for (const column of board.children) column.querySelector(".cards").scrollTop = scroll[column.dataset.status] ?? 0;
  board.scrollLeft = boardScroll;
  if (focused) findFocusTarget(focused)?.focus({ preventScroll: true });
}

// Describes a focusable board element so it can be found again after a rebuild.
const FOCUSABLE = "button, a[href]";
function focusTarget(node) {
  if (!node || !board.contains(node)) return null;
  const card = node.closest(".card");
  if (card) return { selector: `.card[data-id="${card.dataset.id}"]`, index: [...card.querySelectorAll(FOCUSABLE)].indexOf(node) };
  const column = node.closest(".column");
  if (column && node.matches(".add")) return { selector: `.column[data-status="${column.dataset.status}"] .add`, index: -1 };
  return null;
}

function findFocusTarget({ selector, index }) {
  const found = board.querySelector(selector);
  return index < 0 ? found : found?.querySelectorAll(FOCUSABLE)[index];
}

function cardAfterPointer(cards, y) {
  for (const card of cards.querySelectorAll(".card:not(.dragging)")) {
    const box = card.getBoundingClientRect();
    if (y < box.top + box.height / 2) return card;
  }
  return null;
}

// Positions index the whole column, which can hold tickets hidden by the filters.
async function drop(status, cards, id) {
  const column = tickets.filter((t) => t.status === status && t.id !== id);
  const indexOf = (card) => column.findIndex((t) => t.id === Number(card.dataset.id));
  const next = dropLine.nextElementSibling;
  let position = column.length;
  if (next?.classList.contains("card") && !next.classList.contains("dragging")) {
    position = indexOf(next);
  } else {
    const before = [...cards.querySelectorAll(".card:not(.dragging)")].at(-1);
    if (before) position = indexOf(before) + 1;
  }
  dropLine.remove();
  draggingId = null;

  // Show the move straight away, then let the next refresh confirm it.
  const ticket = tickets.find((t) => t.id === id);
  const others = tickets.filter((t) => t.id !== id);
  const after = column[position];
  others.splice(after ? others.indexOf(after) : others.length, 0, { ...ticket, status });
  tickets = others;
  render();

  try {
    await api("PATCH", `/api/tickets/${id}`, { status, position, actor: "user" });
  } catch (error) {
    showToast(error.message);
  }
  await refresh(true);
}

function formValues() {
  return {
    title: form.elements.title.value,
    description: form.elements.description.value,
    status: form.elements.status.value,
    priority: form.elements.priority.value,
    project: form.elements.project.value.trim().toLowerCase() || null,
    idea: form.elements.idea.checked,
    assignee: form.elements.assignee.value.trim().toLowerCase() || null,
    depends_on: [...pendingDependencies].sort((a, b) => a - b),
  };
}

function dependencyRow(id, onRemove) {
  const row = el("div", "dependency");
  const other = ticketById(id);
  const open = el("button", "dependency-link");
  open.type = "button";
  open.dataset.status = other?.status ?? "";
  open.title = other ? `Open #${id}` : "";
  open.append(el("span", "", other ? `#${id} ${other.title}` : `#${id}`));
  open.addEventListener("click", () => {
    if (!other) return;
    if (isDirty()) {
      showError("Save or discard your changes before opening another ticket.");
      return;
    }
    dialog.close();
    openPanel(other);
  });
  row.append(open);
  if (onRemove) {
    const remove = el("button", "icon-button");
    remove.type = "button";
    remove.textContent = "×";
    remove.setAttribute("aria-label", `Remove dependency on #${id}`);
    remove.addEventListener("click", onRemove);
    row.append(remove);
  }
  return row;
}

function renderDependencies() {
  $("depends-on").replaceChildren(
    ...pendingDependencies.map((id) =>
      dependencyRow(id, () => {
        pendingDependencies = pendingDependencies.filter((other) => other !== id);
        if (!addedDependencies.delete(id)) removedDependencies.add(id);
        renderDependencies();
      })
    )
  );
  const blocks = editing?.blocks ?? [];
  $("blocks-section").hidden = !blocks.length;
  $("blocks").replaceChildren(...blocks.map((id) => dependencyRow(id)));
}

// A leading number wins; otherwise an exact title, then a unique partial title.
function findDependency(text) {
  const number = text.match(/^#?(\d+)/)?.[1];
  if (number) return ticketById(Number(number));
  const query = text.toLowerCase();
  const exact = tickets.find((t) => t.title.toLowerCase() === query);
  if (exact) return exact;
  const partial = tickets.filter((t) => t.title.toLowerCase().includes(query));
  return partial.length === 1 ? partial[0] : undefined;
}

function addDependency(announce = true) {
  const input = $("add-dependency");
  if (!input.value.trim()) return;
  const id = findDependency(input.value.trim())?.id;
  if (!id) {
    if (announce) showError("Choose an existing ticket by number, or by a title that matches only one.");
    return;
  }
  if (id === editing?.id) {
    showError("A ticket can't depend on itself.");
    return;
  }
  $("error").hidden = true;
  if (!pendingDependencies.includes(id)) {
    pendingDependencies.push(id);
    if (!removedDependencies.delete(id)) addedDependencies.add(id);
  }
  input.value = "";
  renderDependencies();
}

function isDirty() {
  return (
    JSON.stringify(formValues()) !== JSON.stringify(initialValues) ||
    $("note-input").value.trim() !== ""
  );
}

function renderStamps(ticket) {
  const rows = [["Created", `${timestamp(ticket.created_at)}${ticket.created_by ? ` by ${ticket.created_by}` : ""}`]];
  if (ticket.completed_at) rows.push(["Completed", timestamp(ticket.completed_at)]);
  rows.push(["Updated", timestamp(ticket.updated_at)]);
  $("stamps").replaceChildren(
    ...rows.map(([label, value]) => {
      const row = el("div", "stamp");
      row.append(el("span", "", label), el("span", "", value));
      return row;
    })
  );
}

function openPanel(ticket, status = "follow_up") {
  const trigger = focusTarget(document.activeElement);
  opener = ticket ? { selector: `.card[data-id="${ticket.id}"]`, index: 0, status: ticket.status } : { ...trigger, status };
  editing = ticket;
  editingGone = false;
  addedDependencies = new Set();
  removedDependencies = new Set();
  warnedUnsaved = false;
  $("dialog-title").textContent = ticket ? `#${ticket.id}` : "New ticket";
  dialog.setAttribute("aria-label", ticket ? `Ticket #${ticket.id}: ${ticket.title}` : "New ticket");
  form.elements.title.value = ticket?.title ?? "";
  form.elements.description.value = ticket?.description ?? "";
  renderDescriptionLinks();
  form.elements.status.value = ticket?.status ?? status;
  form.elements.priority.value = ticket?.priority ?? "medium";
  form.elements.project.value = ticket ? ticket.project ?? "" : filter.value;
  form.elements.assignee.value = ticket?.assignee ?? "";
  form.elements.idea.checked = ticket ? ticket.idea : ideasOnly.checked;
  $("note-input").value = "";
  $("add-dependency").value = "";
  pendingDependencies = [...(ticket?.depends_on ?? [])];
  renderDependencies();
  initialValues = formValues();

  disarmDelete();
  $("delete").hidden = !ticket;
  $("cancel-ticket").hidden = !ticket || ticket.status === CANCELLED.status;
  $("error").hidden = true;
  $("stamps").hidden = !ticket;
  if (ticket) renderStamps(ticket);
  $("activity").hidden = !ticket;
  $("notes").replaceChildren();
  $("history").replaceChildren();
  if (ticket) loadActivity(ticket.id);
  dialog.showModal();
  form.elements.title.focus();
}

// Fold a newer copy of the open ticket into the panel: untouched fields follow it, edited ones stay.
function mergeOpenTicket() {
  if (!editing || !dialog.open) return;
  const fresh = ticketById(editing.id);
  if (!fresh) {
    editingGone = true;
    showError("This ticket was deleted. Close the panel to discard your changes.");
    return;
  }
  // updated_at only has second resolution, so compare the whole ticket.
  if (JSON.stringify(fresh) === JSON.stringify(editing)) return;
  const current = formValues();
  const setters = {
    title: (v) => { form.elements.title.value = v; },
    description: (v) => { form.elements.description.value = v; renderDescriptionLinks(); },
    status: (v) => { form.elements.status.value = v; },
    priority: (v) => { form.elements.priority.value = v; },
    project: (v) => { form.elements.project.value = v ?? ""; },
    idea: (v) => { form.elements.idea.checked = v; },
    assignee: (v) => { form.elements.assignee.value = v ?? ""; },
  };
  for (const [key, set] of Object.entries(setters)) {
    if (JSON.stringify(current[key]) !== JSON.stringify(initialValues[key])) continue;
    set(fresh[key]);
    initialValues[key] = formValues()[key];
  }
  for (const id of addedDependencies) if (fresh.depends_on.includes(id)) addedDependencies.delete(id);
  for (const id of removedDependencies) if (!fresh.depends_on.includes(id)) removedDependencies.delete(id);
  pendingDependencies = [
    ...fresh.depends_on.filter((id) => !removedDependencies.has(id)),
    ...addedDependencies,
  ];
  initialValues.depends_on = [...fresh.depends_on].sort((a, b) => a - b);
  editing = fresh;
  $("cancel-ticket").hidden = fresh.status === CANCELLED.status;
  renderDependencies();
  renderStamps(fresh);
  loadActivity(fresh.id);
}

// Closing with edits in progress takes a second attempt, so a stray click can't lose them.
function requestClose() {
  if (isDirty() && !warnedUnsaved) {
    warnedUnsaved = true;
    showError("You have unsaved changes. Close again to discard them.");
    return;
  }
  dialog.close();
}

function restoreOpenerFocus() {
  if (!opener || dialog.open) return;
  const target = (opener.selector && findFocusTarget(opener)) || board.querySelector(`.column[data-status="${opener.status}"] .add`);
  target?.focus({ preventScroll: true });
}

dialog.addEventListener("close", restoreOpenerFocus);

async function loadActivity(id) {
  try {
    const detail = await api("GET", `/api/tickets/${id}`);
    if (editing?.id !== id) return;
    $("notes").replaceChildren(...detail.notes.map(renderNote));
    $("history").replaceChildren(...detail.history.map(renderHistoryEntry));
  } catch (error) {
    showError(error.message);
  }
}

function describeChange({ field, old_value, new_value }) {
  if (field === "created") return "Created the ticket";
  if (field === "description") return "Changed the description";
  const label = (value) => ALL_COLUMNS.find((c) => c.status === value)?.label ?? value ?? "none";
  const name = field === "depends_on" ? "dependencies" : field;
  return `Changed ${name}: ${label(old_value)} → ${label(new_value)}`;
}

function renderHistoryEntry(entry) {
  const node = el("li");
  const by = entry.actor ? `${entry.actor} · ` : "";
  node.append(el("span", "history-change", describeChange(entry)), el("span", "note-meta", `${by}${timestamp(entry.at)}`));
  return node;
}

function renderNote(note) {
  const node = el("div", "note");
  const by = note.author ? `${note.author} · ` : "";
  const body = el("div", "note-body");
  appendLinked(body, note.body);
  node.append(el("div", "note-meta", `${by}${timestamp(note.created_at)}`), body);
  return node;
}

function showError(message) {
  $("error").textContent = message;
  $("error").hidden = false;
}

function disarmDelete() {
  clearTimeout(confirmTimer);
  $("delete").textContent = "Delete";
  $("delete").classList.remove("armed");
}

async function addNote() {
  const body = $("note-input").value.trim();
  if (!body) return;
  try {
    await api("POST", `/api/tickets/${editing.id}/notes`, { body, author: "user" });
    $("note-input").value = "";
    $("error").hidden = true;
    warnedUnsaved = false;
    await loadActivity(editing.id);
    await refresh(true);
  } catch (error) {
    showError(error.message);
  }
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const values = formValues();
  try {
    if (editing) {
      if (editingGone) {
        showError("This ticket was deleted. Close the panel to discard your changes.");
        return;
      }
      // Send only what changed, so saving can't undo an agent's concurrent edit.
      const changes = Object.fromEntries(
        Object.entries(values).filter(
          ([key, value]) => key !== "depends_on" && JSON.stringify(value) !== JSON.stringify(editing[key])
        )
      );
      if (addedDependencies.size || removedDependencies.size) changes.depends_on = values.depends_on;
      if (Object.keys(changes).length) {
        await api("PATCH", `/api/tickets/${editing.id}`, { ...changes, actor: "user" });
      }
      if (changes.status === CANCELLED.status) showToast(`Ticket #${editing.id} cancelled`);
    } else {
      await api("POST", "/api/tickets", { ...values, created_by: "user" });
    }
    dialog.close();
    await refresh(true);
    restoreOpenerFocus();
  } catch (error) {
    showError(error.message);
  }
});

$("close").addEventListener("click", requestClose);
dialog.addEventListener("cancel", (event) => {
  event.preventDefault();
  requestClose();
});
dialog.addEventListener("click", (event) => {
  if (event.target !== dialog) return;
  const box = dialog.getBoundingClientRect();
  if (event.clientX < box.left) requestClose();
});
form.elements.description.addEventListener("input", renderDescriptionLinks);
form.elements.title.addEventListener("keydown", (event) => {
  if (event.key !== "Enter") return;
  event.preventDefault();
  form.requestSubmit();
});

$("add-dependency").addEventListener("change", () => addDependency(false));
$("add-dependency").addEventListener("keydown", (event) => {
  if (event.key !== "Enter") return;
  event.preventDefault();
  addDependency();
});

// Any edit re-arms the unsaved-changes warning.
const rearm = () => { warnedUnsaved = false; };
for (const target of [form, $("note-input")]) {
  target.addEventListener("input", rearm);
  target.addEventListener("change", rearm);
}

$("add-note").addEventListener("click", addNote);
$("note-input").addEventListener("keydown", (event) => {
  if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) addNote();
});

// Submitting the form keeps any edits made in the panel before cancelling.
$("cancel-ticket").addEventListener("click", () => {
  form.elements.status.value = CANCELLED.status;
  form.requestSubmit();
});

$("delete").addEventListener("click", async () => {
  if (!$("delete").classList.contains("armed")) {
    $("delete").textContent = "Confirm delete";
    $("delete").classList.add("armed");
    confirmTimer = setTimeout(disarmDelete, CONFIRM_MS);
    return;
  }
  disarmDelete();
  try {
    await api("DELETE", `/api/tickets/${editing.id}`);
    showToast(`Ticket #${editing.id} deleted`);
    dialog.close();
    await refresh(true);
    restoreOpenerFocus();
  } catch (error) {
    showError(error.message);
  }
});

$("new-ticket").addEventListener("click", () => openPanel(null));

filter.addEventListener("change", () => {
  saveSetting("kanban-project", filter.value);
  render();
});

$("search").addEventListener("input", render);

$("clear-filters").addEventListener("click", () => {
  filter.value = "";
  ideasOnly.checked = false;
  $("search").value = "";
  saveSetting("kanban-project", "");
  saveSetting("kanban-ideas-only", "");
  render();
});
$("search").addEventListener("keydown", (event) => {
  if (event.key !== "Escape") return;
  $("search").value = "";
  $("search").blur();
  render();
});

ideasOnly.addEventListener("change", () => {
  saveSetting("kanban-ideas-only", ideasOnly.checked ? "1" : "");
  render();
});

showCancelled.addEventListener("change", () => {
  saveSetting("kanban-show-cancelled", showCancelled.checked ? "1" : "");
  render();
  if (showCancelled.checked) board.querySelector('[data-status="cancelled"]')?.scrollIntoView({ inline: "nearest", block: "nearest" });
});

document.addEventListener("keydown", (event) => {
  if (dialog.open || event.ctrlKey || event.metaKey || event.altKey) return;
  if (event.target.closest("textarea, select, input:not([type='checkbox'], [type='radio'], [type='button'], [type='submit'])")) return;
  if (event.key === "/") {
    event.preventDefault();
    $("search").focus();
  } else if (event.key.toLowerCase() === "n") {
    event.preventDefault();
    openPanel(null);
  }
});

async function refresh(force = false) {
  try {
    const response = await fetch("/api/tickets");
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const payload = await response.text();
    $("banner").hidden = true;
    // Don't rebuild the board under a drag or when nothing has changed.
    if (draggingId !== null || (!force && payload === lastPayload)) return;
    lastPayload = payload;
    tickets = JSON.parse(payload);
    render();
    mergeOpenTicket();
  } catch {
    $("banner").hidden = false;
  }
}

form.elements.status.append(...ALL_COLUMNS.map((c) => new Option(c.label, c.status)));
form.elements.priority.append(...PRIORITIES.map((p) => new Option(p.label, p.value)));
ideasOnly.checked = loadSetting("kanban-ideas-only") === "1";
showCancelled.checked = loadSetting("kanban-show-cancelled") === "1";
refresh(true);
setInterval(refresh, POLL_MS);
</script>

<script>
// Stats view. Ticket-derived text only ever goes in as text nodes.
const statsView = $("stats-view");
const STAT_TABLES = [
  { key: "by_creator", title: "By creator", column: "Creator", unknown: "Unknown" },
  { key: "by_assignee", title: "By assignee", column: "Assignee", unknown: "Unassigned" },
  { key: "by_project", title: "By project", column: "Project", unknown: "No project" },
  { key: "by_priority", title: "By priority", column: "Priority", unknown: "None" },
];
let statsPayload = null;
let statsRequest = 0;

function formatDuration(seconds) {
  if (seconds === null || seconds === undefined) return "—";
  const minutes = Math.floor(seconds / 60);
  if (minutes < 1) return "<1m";
  const days = Math.floor(minutes / 1440), hours = Math.floor((minutes % 1440) / 60), mins = minutes % 60;
  const parts = days ? [[days, "d"], [hours, "h"]] : hours ? [[hours, "h"], [mins, "m"]] : [[mins, "m"]];
  return parts.filter(([n], i) => n || i === 0).map(([n, u]) => n + u).join(" ");
}

function statsRow(row, spec, max) {
  const tr = el("tr");
  let name = row.name === null ? spec.unknown : row.name;
  if (spec.key === "by_priority") name = PRIORITIES.find((p) => p.value === row.name)?.label ?? name;
  const head = el("th", row.name === null ? "muted" : "", name);
  head.scope = "row";
  head.title = name;
  const count = el("td");
  const cell = el("div", "count-cell");
  const bar = el("span", "count-bar");
  bar.setAttribute("aria-hidden", "true");
  const fill = el("span");
  fill.style.width = `${(row.tickets / max) * 100}%`;
  bar.append(fill);
  cell.append(bar, String(row.tickets));
  count.append(cell);
  tr.append(head, count, el("td", "", String(row.open)), el("td", "", String(row.done)), el("td", "", String(row.cancelled)));
  for (const key of ["avg_completion_seconds", "median_completion_seconds"]) {
    const value = row[key];
    tr.append(el("td", value === null ? "muted" : "", formatDuration(value)));
  }
  return tr;
}

function statsTable(spec, rows) {
  const section = el("section", "stat-section");
  const heading = el("h2", "", spec.title);
  heading.id = `stats-${spec.key}`;
  const scroller = el("div", "table-scroll");
  scroller.tabIndex = 0;
  scroller.setAttribute("role", "region");
  scroller.setAttribute("aria-labelledby", heading.id);
  const table = el("table", "stat-table");
  const headRow = el("tr");
  [spec.column, "Tickets", "Open", "Done", "Cancelled", "Average", "Median"].forEach((label) => {
    const th = el("th", "", label);
    th.scope = "col";
    headRow.append(th);
  });
  const max = Math.max(1, ...rows.map((r) => r.tickets));
  table.append(el("thead"), el("tbody"));
  table.tHead.append(headRow);
  table.tBodies[0].append(...rows.map((row) => statsRow(row, spec, max)));
  scroller.append(table);
  section.append(heading, scroller);
  return section;
}

function renderStats(stats) {
  const scroll = statsView.scrollTop;
  const inner = new Map([...statsView.querySelectorAll(".table-scroll")].map((n) => [n.getAttribute("aria-labelledby"), n.scrollLeft]));
  const body = el("div", "stats-body");
  if (!stats.total) {
    body.append(el("p", "stats-empty", filter.value ? "No tickets in this project yet." : "No tickets yet. Stats appear once the board has some."));
  } else {
    const tiles = el("dl", "tiles");
    for (const [label, value] of [
      ["Total tickets", stats.total],
      ["Open", stats.open],
      ["Done", stats.by_status.done],
      ["Average completion time", formatDuration(stats.avg_completion_seconds)],
      ["Median completion time", formatDuration(stats.median_completion_seconds)],
    ]) {
      const tile = el("div", "tile");
      tile.append(el("dt", "", label), el("dd", "", String(value)));
      tiles.append(tile);
    }
    const tables = el("div", "stat-tables");
    tables.append(...STAT_TABLES.map((spec) => statsTable(spec, stats[spec.key])));
    body.append(tiles, tables, el("p", "stats-note", "Completion time runs from creation to Done, for done tickets. Tickets moved to Done before completion tracking use their last-updated time."));
  }
  statsView.replaceChildren(body);
  statsView.scrollTop = scroll;
  for (const node of statsView.querySelectorAll(".table-scroll")) node.scrollLeft = inner.get(node.getAttribute("aria-labelledby")) ?? 0;
}

async function refreshStats(force = false) {
  if (location.hash !== "#stats" || document.hidden) return;
  const project = filter.value || loadSetting("kanban-project");
  const request = ++statsRequest;
  try {
    const response = await fetch(project ? `/api/stats?project=${encodeURIComponent(project)}` : "/api/stats");
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const payload = await response.text();
    if (request !== statsRequest || location.hash !== "#stats") return;
    $("banner").hidden = true;
    if (!force && payload === statsPayload) return;
    statsPayload = payload;
    renderStats(JSON.parse(payload));
  } catch {
    if (request === statsRequest) $("banner").hidden = false;
  }
}

function applyView() {
  const stats = location.hash === "#stats";
  document.body.dataset.view = stats ? "stats" : "board";
  board.hidden = stats;
  statsView.hidden = !stats;
  for (const [id, on] of [["view-board", !stats], ["view-stats", stats]]) {
    if (on) $(id).setAttribute("aria-current", "page"); else $(id).removeAttribute("aria-current");
  }
  statsPayload = null;
  if (stats) refreshStats(true);
}

window.addEventListener("hashchange", applyView);
filter.addEventListener("change", () => { statsPayload = null; refreshStats(true); });
document.addEventListener("visibilitychange", () => refreshStats());
setInterval(() => refreshStats(), POLL_MS);
applyView();
</script>
</body>
