[project]
name = "kanbot"
version = "0.1.0"
description = "Local kanban board with a web UI and a JSON API for agents"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
kanbot = "kanbot.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
