[project]
name = "kanbot"
version = "0.2.0"
description = "Local kanban board with a web UI and a JSON API for agents"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.16",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
]

[project.scripts]
kanbot = "kanbot.cli:main"
kanbot-hooks = "kanbot.hook_install:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "testcontainers[postgres]>=4.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
